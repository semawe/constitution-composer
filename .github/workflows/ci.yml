name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          # Le fond servi par le Composer est vérifié contre la source
          # canonique de la Constitution, embarquée en sous-module.
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Le fond (src/data/principes.{fr,en}.json) est généré depuis les .md de
      # vendor/holacracy-constitution. Sans cette garde, une retouche à la main
      # d'un côté ou une avancée du texte canonique de l'autre passent inaperçues.
      - name: Fond synchronisé avec la Constitution canonique
        run: npm run fond:check

      - name: Run tests
        run: npm test

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      # L'artefact réellement déployé est l'export statique : sans ce build, la
      # CI peut rester verte alors que la génération statique échoue.
      # Le build de CI n'a pas les clés Supabase et n'est jamais déployé : il
      # assume le mode démonstration, que `src/lib/supabase.ts` exige désormais
      # d'énoncer. Le script de déploiement, lui, refuse un bundle sans backend.
      - name: Build static export
        run: npm run build
        env:
          NEXT_PUBLIC_ALLOW_DEMO_MODE: 'true' 
