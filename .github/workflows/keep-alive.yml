name: Supabase keep-alive

# Le plan Free de Supabase met en pause les projets sans activité base
# pendant plus de 7 jours. Ce cron ping la base une fois par jour pour
# maintenir l'activité (auth + données comptes/versions/Déclarations vivent
# dans Supabase). Voir CLAUDE.md § Supabase.
#
# IMPORTANT (2026-07-04) : une simple LECTURE REST ne compte PAS comme
# « activité suffisante » pour le scan Supabase (projet pausé le 2026-06-26
# puis re-listé le 2026-07-03 malgré des GET quotidiens HTTP 200). On appelle
# donc désormais la fonction RPC `keepalive()` (migration 0004) qui fait une
# ÉCRITURE réelle en base — activité non ambiguë.

on:
  schedule:
    - cron: '17 6 * * *' # tous les jours à 06:17 UTC
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase RPC keepalive (écriture réelle côté Postgres)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          code=$(curl -s -o /tmp/body -w '%{http_code}' \
            --max-time 15 \
            -X POST \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            -d '{}' \
            "$SUPABASE_URL/rest/v1/rpc/keepalive") || curl_exit=$?
          # curl_exit non nul = réseau ou DNS en échec (ex. projet en pause, exit 6)
          if [ "${curl_exit:-0}" -ne 0 ]; then
            echo "curl a échoué (exit ${curl_exit}) — base injoignable ou projet en pause" >&2
            exit 1
          fi
          echo "HTTP $code"
          echo "Réponse : $(cat /tmp/body)"
          # 200 = l'UPDATE a bien eu lieu (la fonction renvoie le timestamp).
          # Tout autre code (000, 4xx, 5xx) = l'écriture n'a pas abouti → échec.
          if [ "$code" != "200" ]; then
            echo "Écriture keepalive échouée (HTTP $code)" >&2
            exit 1
          fi
